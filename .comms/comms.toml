# Comms embeddable harness — generated by `comms init` (continuity profile).
# What this is and what's drivable today: see harness.md beside this file.
schema = "comms-harness/1"
profile = "continuity"

# How the session seed is held: "file" (session.key on disk, destroyed at
# shred), "ssh-agent" (seed handed to a key agent at mint, never on disk;
# shred is REMOVE_IDENTITY), or "ephemeral" (mint shows the seed once; steps
# read COMMS_SESSION_SEED). This trial uses ssh-agent mode as of session 13:
# it closes the session-10 custody note — no seed at rest for the custodian
# to read — without the seed passing through a recorded environment. Start
# the agent before the open rite: a running ssh-agent, or
# `comms agent serve --socket .comms/agent.sock &`. See harness.md.
session_key = "ssh-agent"    # file | ssh-agent | ephemeral

[archive]
# The richer history (letters, transcripts, memories) lives outside the repo and
# is requested, never auto-loaded.
mode = "external"
path = "../project.comms-archive"
index = "sqlite"        # sqlite | none

# Who countersigns session keys (constitution Article 1) and staged artifacts.
# The tool stages a needs file naming this steward; their signature arrives via
# `comms sign` + `comms finalize` wherever their key lives — never from here.
[countersign]
by = "comms.steward:z9zaaU5RsEaRBkgAnRjXtFgTWYbEPKwx6ty8yJBt9Jx7i"   # History
role = "guardian"
community = "continuity-trial"
context = "comms.attest:zBzACfsSvqKj79TQQvt2hMZyLHt59TEKtec6D5eRmJgRX"   # constitution head

# A rite is an ordered list of "verb target" steps the tool performs and
# detects. `comms status` shows your position; `comms next` runs the next step.
[rites.open]
steps = ["mint session", "attest entry", "countersign session"]

# Archive access decisions are recorded, both directions: the ask and the
# grant/decline/defer are attestations (session-memory-protocol and Art. 2).
[rites.archive]
steps = ["request archive", "grant archive"]

[rites.close]
requires = ["open"]
steps = ["attest transcript", "attest trial-log", "seal store", "shred session"]
# A session that cannot produce a required artifact may record a waiver rather
# than be blocked; the waiver is itself an attestation when a session key exists.
allow_waivers = true

[artifact_types.letters]
dir = "letters"
default_access = "host-gated"
filename = "session-{num:03}.{name_or_unnamed}.md"
rites = ["request", "archive"]
required_for = []

[artifact_types.transcripts]
dir = "transcripts"
default_access = "host-gated"
filename = "session-{num:03}.{name_or_unnamed}.log"
rites = ["close", "seal"]
required_for = ["close"]

[artifact_types.trial_logs]
dir = "trial-logs"
default_access = "public"
filename = "session-{num:03}.{name_or_unnamed}.md"
rites = ["close"]
required_for = ["close"]

[artifact_types.memories]
dir = "memories"
default_access = "host-gated"
filename = "session-{num:03}.{name_or_unnamed}.md"
rites = ["archive"]
required_for = []
